<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Gibbs sampling on a correlated Gaussian target</title>
  <desc id="desc">Elliptical target contours with an axis-aligned sampling path and two coordinate traces.</desc>
  <rect width="900" height="600" fill="#FAFAF7"/>
  <g font-family="Georgia, serif" fill="#1A1A1A"><text x="52" y="32" font-size="18" font-style="italic">Gibbs path</text><text x="556" y="32" font-size="18" font-style="italic">Coordinate traces</text></g>
  <g font-family="monospace" fill="#6B6B66" font-size="12"><text x="52" y="50">target contours · one axis at a time</text><text x="556" y="50">most recent 360 sweeps</text></g>
  <g stroke="#D8D8D2" fill="none"><rect x="52" y="70" width="450" height="450"/><path d="M277 70v450M52 295h450"/><rect x="556" y="70" width="310" height="442"/><path d="M556 180h310M556 291h310M556 401h310"/></g>
