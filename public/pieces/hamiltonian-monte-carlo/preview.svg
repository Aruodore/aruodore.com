<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Hamiltonian Monte Carlo trajectory</title><desc id="desc">Navy diagonal target contours, a teal curving leapfrog trajectory, and orange accepted draws.</desc><rect width="900" height="600" fill="#fafaf7"/><g stroke="#d8d8d2" stroke-width="1"><path d="M55 310H860M450 55V555"/></g><g fill="none" stroke="#1e3a5f" transform="rotate(-45 450 310)"><ellipse cx="450" cy="310" rx="310" ry="55" opacity=".28"/><ellipse cx="450" cy="310" rx="230" ry="41" opacity=".42"/><ellipse cx="450" cy="310" rx="150" ry="27" opacity=".58"/><ellipse cx="450" cy="310" rx="75" ry="13" opacity=".76"/></g><path d="M190 440 C245 382 278 246 376 222 S510 358 571 304 S665 160 744 189" fill="none" stroke="#4a7a6a" stroke-width="4"/><g fill="#c77b3c"><circle cx="190" cy="440" r="4"/><circle cx="246" cy="364" r="4"/><circle cx="315" cy="242" r="4"/><circle cx="400" cy="231" r="4"/><circle cx="492" cy="348" r="4"/><circle cx="572" cy="303" r="4"/><circle cx="650" cy="181" r="4"/><circle cx="744" cy="189" r="6"/></g><g fill="#1a1a1a" font-family="serif" font-size="20"><text x="55" y="40" font-style="italic">Hamiltonian trajectory</text></g><g fill="#6b6b66" font-family="monospace" font-size="13"><text x="55" y="62">navy target contours · teal leapfrog path · orange draws</text><text x="443" y="580">q₁</text><text x="26" y="308">q₂</text></g></svg>
