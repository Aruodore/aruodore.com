<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">Bootstrap resampling and sampling distribution</title>
  <desc id="description">Orange observed values and a navy resample sit beside a histogram of bootstrap means with a percentile interval.</desc>
