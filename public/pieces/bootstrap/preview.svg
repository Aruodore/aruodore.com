    <text x="346" y="32" text-anchor="end">n = 24</text>
    <text x="412" y="32">BOOTSTRAP MEANS</text>
    <text x="866" y="32" text-anchor="end">B = 2,000</text>
    <text x="34" y="290">ONE RESAMPLE</text>
  </g>
  <g stroke="#D8D8D2">
