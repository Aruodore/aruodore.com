    <circle cx="254" cy="205" r="4"/><circle cx="276" cy="205" r="4"/><circle cx="302" cy="205" r="4"/>
    <circle cx="330" cy="205" r="4"/><circle cx="195" cy="205" r="4"/><circle cx="158" cy="205" r="4"/>
  </g>
  <line x1="174" y1="54" x2="174" y2="191" stroke="#C77B3C" stroke-dasharray="4 4"/>
  <text x="174" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1A1A1A">sample mean</text>
  <g fill="#1E3A5F">
    <circle cx="62" cy="402" r="4"/><circle cx="85" cy="402" r="4"/><circle cx="85" cy="394" r="4"/>
    <circle cx="103" cy="402" r="4"/><circle cx="119" cy="402" r="4"/><circle cx="119" cy="394" r="4"/>
    <circle cx="136" cy="402" r="4"/><circle cx="145" cy="402" r="4"/><circle cx="154" cy="402" r="4"/>
    <circle cx="154" cy="394" r="4"/><circle cx="165" cy="402" r="4"/><circle cx="177" cy="402" r="4"/>
    <circle cx="177" cy="394" r="4"/><circle cx="189" cy="402" r="4"/><circle cx="203" cy="402" r="4"/>
    <circle cx="203" cy="394" r="4"/><circle cx="218" cy="402" r="4"/><circle cx="236" cy="402" r="4"/>
    <circle cx="254" cy="402" r="4"/><circle cx="254" cy="394" r="4"/><circle cx="276" cy="402" r="4"/>
