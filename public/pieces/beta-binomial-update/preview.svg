  <title id="title">Beta-binomial update</title>
  <desc id="desc">A teal Beta(2, 2) prior over a success probability, and a much narrower navy posterior after 60 Bernoulli trials with 38 successes, its central 95 percent credible band shaded. Below, an orange strip records each trial: filled cells are successes, outlined cells are failures. A dashed line marks the data-generating probability, which the posterior is never told.</desc>
